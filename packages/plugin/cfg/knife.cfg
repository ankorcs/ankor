// Apply before ending warmup for knife. The side choice that follows the knife round is a warmup on
// the reset, the mode's, base, the launch's and warmup cfgs; going live, the plugin runs the reset,
// the mode's cfg, base and the launch's cfg again, which restore the match format.

// Keep team selection disabled after map and phase configuration reloads.
sv_disable_teamselect_menu 1

bot_quota 0
bot_kick

mp_maxmoney 0
mp_startmoney 0
mp_afterroundmoney 0
mp_buytime 0
mp_buy_anywhere 0
mp_playercashawards 0
mp_teamcashawards 0

mp_ct_default_melee weapon_knife
mp_ct_default_secondary ""
mp_ct_default_primary ""
mp_t_default_melee weapon_knife
mp_t_default_secondary ""
mp_t_default_primary ""

mp_free_armor 1

// The plugin tallies alive count/HP; disable the bomb objective.
mp_give_player_c4 0
mp_defuser_allocation 0
mp_death_drop_gun 0
mp_death_drop_grenade 0
mp_death_drop_defuser 0
mp_weapons_allow_zeus 0
mp_weapons_allow_map_placed 0

mp_ignore_round_win_conditions 0
mp_freezetime 10
mp_roundtime 1.92
mp_roundtime_defuse 1.92
mp_roundtime_hostage 1.92
mp_round_restart_delay 4
mp_respawn_immunitytime 0
mp_respawn_on_death_ct 0
mp_respawn_on_death_t 0
mp_timelimit 0

// Do not inherit warmup's zero round limit: one knife win must not end the match.
mp_maxrounds 24
mp_winlimit 0
// Off until going live, when the mode's cfg sets it again. Without it, CS2 skips the team intro
// when the match goes live.
mp_halftime 0
mp_match_can_clinch 0
mp_match_end_restart 1
mp_team_intro_time 0

mp_autokick 0
mp_autoteambalance 0
mp_limitteams 0
mp_solid_teammates 1
mp_friendlyfire 0

sv_infinite_ammo 0
sv_allow_votes 0
sv_full_alltalk 0
sv_deadtalk 1
sv_talk_enemy_living 0
sv_talk_enemy_dead 0
