// What warmup and the knife round change, back to the engine's defaults. The plugin runs this
// ahead of the mode's cfg at the side choice and when the match goes live, so the mode's cfg then
// sets its own values over these, and a cvar that the mode leaves alone ends at its default.
mp_give_player_c4 1
mp_ignore_round_win_conditions 0
mp_teammates_are_enemies 0
mp_winlimit 0
mp_round_restart_delay 7
mp_team_intro_time 6.5
mp_warmup_pausetimer 0
sv_full_alltalk 0
