// Warm up while waiting for the roster; the plugin ends warmup before knife or live.

// Keep team selection disabled after map and phase configuration reloads.
sv_disable_teamselect_menu 1

bot_quota 0
bot_kick

mp_warmuptime 9999
mp_warmup_pausetimer 1

// Automatic warmup completion stays off (the plugin controls the transition). Its cvar,
// mp_endwarmup_player_count, is not on the workshop-map convar whitelist and one disallowed line
// makes the engine drop this whole file, so it is left at its default (0) rather than set here.
mp_warmuptime_all_players_connected 0

mp_afterroundmoney 16000
mp_maxmoney 16000
mp_startmoney 16000
mp_buytime 9999
mp_buy_anywhere 1
mp_free_armor 2
mp_freezetime 0
mp_respawn_immunitytime 2
mp_respawn_on_death_ct 1
mp_respawn_on_death_t 1
mp_death_drop_gun 0
mp_death_drop_grenade 0
mp_death_drop_defuser 0
mp_weapons_allow_zeus 1
mp_give_player_c4 0

mp_roundtime 60
mp_roundtime_defuse 60
mp_roundtime_hostage 60
mp_round_restart_delay 3
mp_timelimit 0
mp_maxrounds 0
// Off until going live, when the mode's cfg sets it again. Without it, CS2 skips the team intro
// when the match goes live.
mp_halftime 0
mp_match_end_restart 1
mp_team_intro_time 0

// Leave mp_ignore_round_win_conditions alone: it persists through exec/restarts into knife and live.
mp_randomspawn 0
mp_teammates_are_enemies 0

// The plugin owns team assignment.
mp_autokick 0
mp_autoteambalance 0
mp_limitteams 0
mp_solid_teammates 0
mp_friendlyfire 0

sv_deadtalk 1
sv_allow_votes 0
sv_infinite_ammo 0
