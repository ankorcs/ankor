// Ankor's settings for a match, whatever the game mode. The plugin runs this after the mode's cfg,
// such as gamemode_competitive, then the launch's cfg, at warmup, at the side choice and when the
// match goes live. The format itself is the mode's and the launch's.

// Keep simulating while empty so reconnects do not wait for hibernation.
sv_hibernate_when_empty 0

// Roster rejection should kick without temporarily banning the player.
sv_kick_ban_duration 0

// Allow time to view the final scoreboard before map restart.
mp_match_restart_delay 60

// Stay on the map when the match ends, instead of loading the mapcycle's next one.
mp_match_end_restart 1

// The plugin owns team assignment.
sv_disable_teamselect_menu 1
mp_autoteambalance 0
mp_limitteams 0
mp_autokick 0
bot_quota 0
bot_kick

// The plugin owns the end of warmup.
mp_endwarmup_player_count 0
mp_warmuptime_all_players_connected 0
