// A marker that tells the plugin its cfgs have run. It sets nothing.
//
// The plugin cannot act on a cfg straight after queuing it. A console line's `exec` runs after
// the rest of the command buffer, so a command queued behind `exec ankor/base` would run before
// base's lines. To act once its cfgs have run, the plugin queues `exec ankor/applied` behind them
// and holds the action. This exec is deferred in the same way, so this file runs after those cfgs.
//
// The command below is one that the plugin registers. When it runs, the plugin takes the oldest
// held action and runs it, such as ending warmup on the live cfgs or starting the demo. If the
// marker is lost, a 2-second timeout runs the action anyway. AfterCommandsQueue.cs has the queue.
ankor_cfg_applied
