# The profile cargo-mutants runs (.cargo/mutants.toml). A mutant that makes a loop run forever
# fails here after 30 seconds, instead of running into cargo-mutants' longer timeout. The slowest
# test takes a few seconds.
[profile.mutants]
slow-timeout = { period = "15s", terminate-after = 2 }

# The corpus tests replay tens of thousands of cases and take tens of seconds on a busy machine. A
# test cut short counts as a failure, so a mutant would look caught; these get far more room.
[[profile.mutants.overrides]]
filter = 'test(validators_agree_with_the_contract) | test(valid_values_round_trip_through_their_types)'
slow-timeout = { period = "60s", terminate-after = 5 }
