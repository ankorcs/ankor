name: Agent

# The Rust agent in packages/agent: the same checks as a local run, packages/agent/scripts/check.sh,
# which runs itself in the packages/agent/docker/ci.Dockerfile toolchain, with the Docker suites
# against the runner's daemon. A red run reproduces with `packages/agent/scripts/check.sh --docker`.
# ci.yml and release.yml run it when a change touches the agent, as scripts/ci-changes.sh lists
# its paths.
on:
  workflow_call:
    inputs:
      image:
        description: Also build the agent's image. release.yml builds it instead when it publishes it.
        type: boolean
        default: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The test binaries fit on the runner's disk without incremental data, which a build from the
  # cache never uses, and with line tables only, which still give a panic its file and line.
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  # scripts/lib/in-docker.sh runs the image this workflow builds, with the build output and
  # registry that the checks job caches between runs.
  CI_IMAGE_BUILT: '1'

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # actions/cache refuses a path with `..`, so the cached folders sit in the runner's temp folder,
      # which workflow-level env cannot name.
      - run: |
          {
            echo "CARGO_TARGET_HOST=${RUNNER_TEMP}/cargo-target"
            echo "CARGO_REGISTRY_HOST=${RUNNER_TEMP}/cargo-registry"
          } >>"$GITHUB_ENV"

      # The runner's preinstalled SDKs take most of its disk, and none of them is used here.
      - run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: packages/agent
          file: packages/agent/docker/ci.Dockerfile
          tags: ankorcs-rst-ci
          load: true
          cache-from: type=gha,scope=ci-image
          cache-to: type=gha,scope=ci-image,mode=max

      - uses: actions/cache@v6
        with:
          path: |
            ${{ env.CARGO_TARGET_HOST }}
            ${{ env.CARGO_REGISTRY_HOST }}
          key: cargo-${{ hashFiles('packages/agent/Cargo.lock', 'packages/agent/docker/ci.Dockerfile') }}
          restore-keys: cargo-

      # Written from packages/protocol; it changes only with the generator's inputs and the protocol.
      - uses: actions/cache@v6
        with:
          path: |
            packages/agent/crates/*/tests/*corpus.jsonl
            packages/agent/crates/protocol/tests/corpus.stamp
          key: corpus-${{ hashFiles('packages/agent/codegen/corpus.mjs', 'packages/agent/codegen/generate.mjs', 'packages/agent/codegen/protocol.mjs', 'packages/agent/codegen/package-lock.json', 'packages/protocol/**', 'package-lock.json', 'tsconfig.base.json') }}

      - run: packages/agent/scripts/check.sh --docker

      # The generated wire contract and container contract must match packages/protocol; a change
      # there needs `scripts/protocol-sync.sh --update`.
      - run: packages/agent/scripts/protocol-sync.sh

  image:
    name: Image build
    if: inputs.image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - id: version
        run: echo "version=$(sed -n 's/^version = "\(.*\)"$/\1/p' packages/agent/crates/agent/Cargo.toml)" >>"$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      # Reads the layers the last release wrote; a pull request's cache would reach no other branch.
      - uses: docker/build-push-action@v7
        with:
          context: packages/agent
          file: packages/agent/docker/Dockerfile
          platforms: linux/amd64
          push: false
          build-args: VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=agent-image
