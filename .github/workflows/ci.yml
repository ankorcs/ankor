name: CI

# Every pull request and every push to develop runs the Markdown link check, and the checks of each
# part it changes, as scripts/ci-changes.sh lists the parts. No image is built here: release.yml
# builds the images on a merge into master and publishes nothing unless they build. The exception is
# the CS2 image on SwiftlyS2's bump pull request, which swiftlys2.yml merges on its own once its checks
# pass, so a SwiftlyS2 release that does not build stops before master. All checks passes when each of
# them passed or had nothing to check, so it is the one check to wait for.
on:
  pull_request:
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    # ci-changes.sh prints a `part=true|false` line per part into $GITHUB_OUTPUT. These lines pass
    # them on to the jobs below as needs.changes.outputs.<part>.
    outputs:
      protocol: ${{ steps.changes.outputs.protocol }}
      agent: ${{ steps.changes.outputs.agent }}
      cs2: ${{ steps.changes.outputs.cs2 }}
      docs: ${{ steps.changes.outputs.docs }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: scripts/release-line.sh
      # A pull request's checkout is the pull request merged into its base, so the diff from the base
      # is its change. A push compares with the commit before it.
      - id: changes
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: scripts/ci-changes.sh "$BASE" "$GITHUB_SHA" | tee -a "$GITHUB_OUTPUT"

  # A renamed file can break a link from Markdown that the pull request leaves alone, so this always
  # runs.
  links:
    name: Links
    uses: ./.github/workflows/check-links.yml

  protocol:
    name: Protocol
    needs: changes
    if: needs.changes.outputs.protocol == 'true'
    uses: ./.github/workflows/check-protocol.yml

  agent:
    name: Agent
    needs: changes
    if: needs.changes.outputs.agent == 'true'
    uses: ./.github/workflows/check-agent.yml
    with:
      image: false

  cs2:
    name: CS2 image
    needs: changes
    if: needs.changes.outputs.cs2 == 'true'
    uses: ./.github/workflows/check-cs2.yml
    with:
      image: ${{ startsWith(github.head_ref, 'swiftlys2/') }}

  docs:
    name: Docs
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    uses: ./.github/workflows/check-docs.yml

  all:
    name: All checks
    needs: [changes, links, protocol, agent, cs2, docs]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
