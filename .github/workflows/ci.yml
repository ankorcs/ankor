name: CI

# Every pull request runs the Markdown link check, and the checks of each part it changes, as
# scripts/ci-changes.sh lists the parts. All checks passes when each of them passed or had nothing
# to check, so it is the one check to wait for.
on:
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    # ci-changes.sh prints a `part=true|false` line per part into $GITHUB_OUTPUT. These lines pass
    # them on to the jobs below as needs.changes.outputs.<part>.
    outputs:
      protocol: ${{ steps.changes.outputs.protocol }}
      agent: ${{ steps.changes.outputs.agent }}
      cs2: ${{ steps.changes.outputs.cs2 }}
      docs: ${{ steps.changes.outputs.docs }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: scripts/release-line.sh
      # The checkout is the pull request merged into its base, so the diff from the base is the
      # pull request's change.
      - id: changes
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: scripts/ci-changes.sh "$BASE" "$GITHUB_SHA" | tee -a "$GITHUB_OUTPUT"

  # A renamed file can break a link from Markdown that the pull request leaves alone, so this always
  # runs.
  links:
    name: Links
    uses: ./.github/workflows/check-links.yml

  protocol:
    name: Protocol
    needs: changes
    if: needs.changes.outputs.protocol == 'true'
    uses: ./.github/workflows/check-protocol.yml

  agent:
    name: Agent
    needs: changes
    if: needs.changes.outputs.agent == 'true'
    uses: ./.github/workflows/check-agent.yml
    with:
      image: true

  cs2:
    name: CS2 image
    needs: changes
    if: needs.changes.outputs.cs2 == 'true'
    uses: ./.github/workflows/check-cs2.yml
    with:
      image: true

  docs:
    name: Docs
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    uses: ./.github/workflows/check-docs.yml

  all:
    name: All checks
    needs: [changes, links, protocol, agent, cs2, docs]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
