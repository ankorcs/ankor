name: Image build

# Builds node images and keeps each as an OCI archive artifact of the run, which image-publish.yml
# pushes. The CS2 image runs the plugin's tests as it builds. release.yml, rebuild.yml and
# cs2-beta.yml call this.
on:
  workflow_call:
    inputs:
      builds:
        description: >-
          A JSON list of {image, version, ref, latest}, one entry per image to build. A CS2 entry may
          add swiftly_version and swiftly_sha256 to build on that SwiftlyS2 release instead of the pin.
        type: string
        required: true
      fresh:
        description: Build on freshly pulled base images without any layer cache.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: ankor-${{ matrix.image }} ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.builds) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.ref }}

      - id: image
        env:
          IMAGE: ${{ matrix.image }}
          VERSION: ${{ matrix.version }}
          FRESH: ${{ inputs.fresh }}
          SWIFTLY_VERSION: ${{ matrix.swiftly_version }}
          SWIFTLY_SHA256: ${{ matrix.swiftly_sha256 }}
        run: |
          {
            # Each image builds from its own package.
            case "$IMAGE" in
              agent) context=packages/agent ;;
              cs2) context=packages/plugin ;;
            esac
            dockerfile="${context}/docker/Dockerfile"
            echo "context=${context}"
            echo "dockerfile=${dockerfile}"
            # Only the Rust agent's release reuses and refreshes the layer cache its pull requests read.
            [[ "$IMAGE" == agent && "$FRESH" != true ]] && echo "cache=type=gha,scope=agent-image"
            echo "description=$(sed -n 's/^LABEL org.opencontainers.image.description="\(.*\)"$/\1/p' "$dockerfile")"
            # Each Dockerfile labels its image with VERSION and REVISION. It refuses a VERSION other
            # than its package's version.
            # A SwiftlyS2 release other than the pin goes in as build arguments and a label.
            echo "build-args<<EOF"
            echo "VERSION=${VERSION}"
            echo "REVISION=$(git rev-parse HEAD)"
            if [[ -n "$SWIFTLY_VERSION" ]]; then
              echo "SWIFTLY_VERSION=${SWIFTLY_VERSION}"
              echo "SWIFTLY_SHA256=${SWIFTLY_SHA256}"
            fi
            echo "EOF"
            echo "labels<<EOF"
            [[ -n "$SWIFTLY_VERSION" ]] && echo "ankor.swiftlys2.version=${SWIFTLY_VERSION}"
            echo "EOF"
          } >>"$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: ${{ steps.image.outputs.context }}
          file: ${{ steps.image.outputs.dockerfile }}
          platforms: linux/amd64
          pull: true
          no-cache: ${{ inputs.fresh }}
          cache-from: ${{ steps.image.outputs.cache }}
          cache-to: ${{ steps.image.outputs.cache && format('{0},mode=max', steps.image.outputs.cache) || '' }}
          outputs: type=oci,dest=${{ runner.temp }}/image.tar
          build-args: ${{ steps.image.outputs.build-args }}
          labels: ${{ steps.image.outputs.labels }}
          # GHCR reads the description from here, not from the Dockerfile label. A single-platform OCI
          # archive has no image index, so it goes on the manifest.
          annotations: |
            manifest:org.opencontainers.image.description=${{ steps.image.outputs.description }}

      # The layers are compressed already.
      - uses: actions/upload-artifact@v7
        with:
          name: image-${{ matrix.image }}-${{ matrix.version }}
          path: ${{ runner.temp }}/image.tar
          compression-level: 0
          retention-days: 1
